      rel="stylesheet"
    />

    <!-- Theme bootstrap: runs before first paint so there is no flash of the wrong theme.
         Default is dark, per design intent. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('yk-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 48px; font-family: system-ui, sans-serif">
