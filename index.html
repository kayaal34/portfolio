<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Yahya Kayaal — Software Engineer &amp; AI Developer</title>
    <meta
      name="description"
      content="Portfolio of Yahya Kayaal (kayaal.is-a.dev) — backend software engineer and AI developer. Scalable services with Python and FastAPI, AI/NLP pipelines, cross-platform apps with Flutter, and embedded Linux systems. MSc in Artificial Intelligence at ITMO."
    />
    <meta name="author" content="Yahya Kayaal" />

    <!-- Crawling, stated explicitly: this page is meant to be indexed and
         followed. Leaving it implicit is how sites quietly stay invisible. -->
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://kayaal.is-a.dev/" />

    <meta name="theme-color" content="#060608" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#FAFAFC" media="(prefers-color-scheme: light)" />
    <meta name="color-scheme" content="dark light" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kayaal.is-a.dev/" />
    <meta property="og:site_name" content="Yahya Kayaal" />
    <meta property="og:title" content="Yahya Kayaal — Software Engineer &amp; AI Developer" />
    <meta
      property="og:description"
      content="Backend engineering with Python and FastAPI, AI/NLP pipelines, Flutter apps and embedded Linux systems. Trained at VK and Yandex; MSc in AI at ITMO."
    />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Yahya Kayaal — Software Engineer &amp; AI Developer" />
    <meta
      name="twitter:description"
      content="Backend engineering with Python and FastAPI, AI/NLP pipelines, Flutter apps and embedded Linux systems."
    />

    <!-- Structured data: tells Google this is a person, and which one. It is
         what powers a knowledge panel for a branded search like the name. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Yahya Kayaal",
        "alternateName": "Кайаал Яхья",
        "url": "https://kayaal.is-a.dev/",
        "jobTitle": "Software Engineer",
        "description": "Backend software engineer and AI developer. Python, FastAPI, AI/NLP, Flutter and embedded Linux.",
        "knowsLanguage": ["tr", "ru", "en"],
        "alumniOf": [
          { "@type": "CollegeOrUniversity", "name": "Ural Federal University" },
          { "@type": "CollegeOrUniversity", "name": "ITMO University" }
        ],
        "sameAs": [
          "https://github.com/kayaal34",
          "https://www.linkedin.com/in/yahya-kayaal",
          "https://t.me/kayaal34"
        ]
      }
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Playfair+Display:ital,wght@0,400..700;1,400..600&family=JetBrains+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Theme bootstrap: runs before first paint so there is no flash of the wrong theme.
         Default is dark, per design intent. -->
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem('yk-theme');
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark';
          var root = document.documentElement;
          root.classList.toggle('dark', theme === 'dark');
          root.style.colorScheme = theme;
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding: 48px; font-family: system-ui, sans-serif">
        <h1>Yahya Kayaal — Software Engineer</h1>
        <p>This portfolio needs JavaScript enabled. Reach me at Yahyaeren34@yandex.ru.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
